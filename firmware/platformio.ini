; ESP8266 WiFi clock firmware - weather and desktop dashboard display
; Board: ESP-12S based "SD2/小电视" weather clock w/ 1.54" ST7789 240x240 SPI TFT.
; Pin mapping below comes from the vendor's own working reference firmware
; (TFT_eSPI/User_Setup.h + SmallDesktopDisplay.ino, from the oshwhub SD2 project):
;   CS -> GPIO15/D8   DC -> GPIO0/D3   RST -> GPIO2/D4
;   SCLK -> GPIO14/D5 (HW SPI)   MOSI -> GPIO13/D7 (HW SPI)
;   Backlight -> GPIO5/D1, active LOW, PWM-driven for brightness in vendor fw
; If your board is wired differently, change the TFT_* build_flags below.

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.1

build_flags =
    ; ---- TFT_eSPI setup for a 240x240 ST7789 SPI panel (vendor-confirmed pins) ----
    -D USER_SETUP_LOADED=1
    -D ST7789_2_DRIVER=1
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=13   ; D7 - HW SPI MOSI
    -D TFT_SCLK=14   ; D5 - HW SPI SCLK
    -D TFT_CS=15     ; D8 - CS
    -D TFT_DC=0      ; D3 - DC
    -D TFT_RST=2     ; D4 - RESET
    -D TFT_BL=5      ; D1 - backlight, active LOW
    -D TFT_BACKLIGHT_ON=LOW
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    ; ---- WiFiManager: Chinese captive-portal strings (include/wm_strings_zh.h) ----
    -I include
    -D WM_STRINGS_FILE='"wm_strings_zh.h"'

; Direct USB profile for the FuBoTV / SD2 / MG01 ESP8266 board.
; It keeps the radio off and receives all dashboard data over CH340 serial.
[env:fubotv-usb]
extends = env:nodemcuv2
build_flags =
    ${env:nodemcuv2.build_flags}
    -D AICLOCK_WIRED_ONLY=1

; Waveshare ESP32-S3-Touch-LCD-1.54.
; The board uses native USB Serial/JTAG, 16 MB QIO flash, 8 MB OPI PSRAM,
; a 240x240 ST7789 panel, and an active-high backlight.
[env:waveshare-s3-touch-lcd-154]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_s3_16mb.csv
board_build.filesystem = littlefs

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.1
    knolleary/PubSubClient@2.8
    lewisxhe/SensorLib@0.2.6

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM=1
    -D USE_FSPI_PORT=1
    -D AICLOCK_BOARD_ESP32_S3_TOUCH_LCD_1_54=1
    -D AICLOCK_POWER_HOLD_PIN=2
    -D AICLOCK_BACKLIGHT_ACTIVE_HIGH=1
    -D AICLOCK_IMU_SDA=42
    -D AICLOCK_IMU_SCL=41
    -D AICLOCK_BATTERY_ADC_PIN=1
    -D AICLOCK_BATTERY_CHARGE_PIN=3
    -D AICLOCK_BATTERY_DIVIDER=3.0f
    -D USER_SETUP_LOADED=1
    -D ST7789_2_DRIVER=1
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MISO=-1
    -D TFT_MOSI=39
    -D TFT_SCLK=38
    -D TFT_CS=21
    -D TFT_DC=45
    -D TFT_RST=40
    -D TFT_BL=46
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -I include
    -D WM_STRINGS_FILE='"wm_strings_zh.h"'
